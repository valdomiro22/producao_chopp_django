{% load django_bootstrap5 %}
{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Produto</title>
    {% bootstrap_css %}
    {% comment %} <link rel="stylesheet" href="{% static "css/styles.css" %}"> {% endcomment %}
</head>
<body>
    <div class="container">
        <h1 class="text-primary">Adicionar Produto</h1>
        {% bootstrap_messages %}

        <form action="{% url "adicionar-produto" %}" method="post" class="form" autocomplete="off">
        {% csrf_token %}
        {% bootstrap_form form %}
        <button type="submit" class="btn btn-primary">Adicionar</button>
    </form>
    </div>
</body>
</html>
