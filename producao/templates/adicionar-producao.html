{% load django_bootstrap5 %}
{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Produção</title>
    {% bootstrap_css %}
    <link rel="stylesheet" href="{% static "producao/css/styles.css" %}">
</head>
<body>
    <div class="container">
        <div class="cabecalho">
            <h1 class="text-primary">Adicionar Produção</h1>

            <div class="links">
                <a href="{% url "adicionar-barril" %}" class="btn btn-primary">Adicionar Barril</a>
                <a href="{% url "adicionar-produto" %}" class="btn btn-primary">Adicionar Produto</a>
            </div>
        </div>

        <form method="post" class="form" autocomplete="off">
        {% csrf_token %}
        {% bootstrap_form form %}
        <button type="submit" class="btn btn-primary">Adicionar</button>
    </form>
    </div>
</body>
</html>
